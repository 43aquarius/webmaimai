<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>舞萌 Web | maimai Web Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* webmaimai 单文件版样式 */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  background: #060a1c; color: #fff;
  font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Yuanti SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  user-select: none; -webkit-user-select: none;
}
#app { position: fixed; inset: 0; }
.screen { position: absolute; inset: 0; }
button { font-family: inherit; cursor: pointer; border: none; outline: none; }
img { -webkit-user-drag: none; user-drag: none; }
.mono { font-variant-numeric: tabular-nums; }
kbd {
  display: inline-block; min-width: 1.6em; text-align: center; padding: 1px 6px;
  border-radius: 6px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25);
  font: 700 12px/1.6 inherit; color: #fff;
}

/* ---------- 按钮 ---------- */
.btn { border-radius: 14px; font-weight: 900; transition: transform .15s, filter .15s; }
.btn:hover { transform: scale(1.04); filter: brightness(1.1); }
.btn:active { transform: scale(.96); }
.btn.cyan { background: #22d3ee; color: #062033; padding: 12px 32px; font-size: 18px; }
.btn.pink { background: #ec4899; color: #fff; padding: 12px 32px; font-size: 18px; }
.btn.play {
  width: 100%; padding: 16px; font-size: 20px; letter-spacing: .2em;
  background: linear-gradient(90deg, #ec4899, #22d3ee); color: #081226;
  box-shadow: 0 0 30px rgba(255,79,160,.4);
}
.btn.ghost { background: rgba(255,255,255,.1); color: #fff; padding: 8px 16px; font-size: 14px; font-weight: 700; }
.btn.ghost:hover { background: rgba(255,255,255,.2); }
.btn.ghost.sm { padding: 6px 12px; font-size: 13px; }
.btn.ghost2 { background: rgba(255,255,255,.1); color: rgba(255,255,255,.8); padding: 10px 28px; font-size: 16px; font-weight: 700; }

/* ---------- 标题画面 ---------- */
.title-bg { position: absolute; inset: 0; filter: brightness(.5) saturate(1.2); }
.title-overlay {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 35%, transparent 30%, rgba(6,10,28,.75) 100%);
  animation: mmPulse 3s ease-in-out infinite;
}
@keyframes mmPulse { 0%,100% { opacity: .85 } 50% { opacity: 1 } }
.title-content {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; text-align: center; cursor: pointer;
}
.title-sega {
  font-size: 14px; letter-spacing: .8em; padding-left: .8em; color: rgba(255,255,255,.6); font-weight: 700;
}
.title-logo {
  font-size: clamp(56px, 12vw, 120px); font-weight: 900; line-height: 1.04;
  background: linear-gradient(180deg, #fff 20%, #7fd0ff 60%, #ff6ec7 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 6px 30px rgba(62,230,255,.35));
  animation: mmLogoIn .8s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes mmLogoIn { from { transform: scale(.7) translateY(30px); opacity: 0 } to { transform: none; opacity: 1 } }
.title-logo span { font-size: .38em; letter-spacing: .18em; font-weight: 800; }
.title-sub { color: rgba(160,215,255,.85); letter-spacing: .35em; font-size: 13px; font-weight: 700; }
.title-press {
  margin-top: 26px; font-size: 20px; font-weight: 900; letter-spacing: .18em; color: #fff;
  animation: mmBlink 1.1s infinite;
}
@keyframes mmBlink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
.title-rating {
  color: #ffd76a; font-weight: 800; font-size: 15px; letter-spacing: .1em;
  padding: 6px 20px; border-radius: 999px; background: rgba(255,211,77,.12);
  border: 1px solid rgba(255,211,77,.35);
}
.title-btns { display: flex; gap: 12px; margin-top: 8px; }
.title-foot { position: absolute; bottom: 16px; font-size: 11px; color: rgba(255,255,255,.35); letter-spacing: .05em; }

/* ---------- 选曲画面 ---------- */
.select-bg {
  position: absolute; inset: 0; background-size: cover; background-position: center;
  filter: blur(60px) brightness(.35) saturate(1.4); transform: scale(1.4); transition: background-image .3s;
}
.select-screen::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(6,10,28,.6), rgba(6,10,28,.3) 40%, rgba(6,10,28,.95));
}
.select-top { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 14px 24px; flex-wrap: wrap; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab {
  padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 800;
  background: rgba(255,255,255,.1); color: rgba(255,255,255,.7); transition: all .15s;
}
.tab:hover { background: rgba(255,255,255,.2); }
.tab.on { background: #22d3ee; color: #062033; box-shadow: 0 0 18px rgba(62,230,255,.5); }
.top-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.rating-pill {
  display: flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 999px;
  background: rgba(255,211,77,.13); border: 1px solid rgba(255,211,77,.35);
  color: #ffd76a; font-size: 13px; font-weight: 900;
}
.rating-pill b { color: #fff; font-size: 17px; }

.select-main {
  position: absolute; top: 70px; bottom: 150px; left: 0; right: 0; z-index: 4;
  display: flex; align-items: center; justify-content: center; gap: 40px; padding: 0 40px;
}
.song-info { width: 280px; flex-shrink: 0; }
.now-selecting { color: rgba(103,232,249,.8); font-size: 11px; letter-spacing: .3em; font-weight: 800; margin-bottom: 4px; }
.song-info h2 { font-size: 26px; line-height: 1.2; margin-bottom: 12px; word-break: break-all; }
.info-table { width: 100%; font-size: 14px; border-collapse: collapse; }
.info-table td { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.1); }
.info-table td:first-child { color: rgba(255,255,255,.5); }
.info-table td.ar { text-align: right; font-weight: 800; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.info-table tr > td:last-child { text-align: right; font-weight: 800; }
.best-title { margin: 16px 0 6px; font-size: 11px; letter-spacing: .15em; color: rgba(255,255,255,.4); }
.best-row { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 3px 0; }
.diff-chip {
  width: 96px; text-align: center; padding: 2px 0; border-radius: 6px;
  font-size: 11px; font-weight: 900; flex-shrink: 0;
}
.diff-chip.lg { width: auto; padding: 4px 14px; font-size: 14px; border-radius: 8px; }
.tag { font-style: normal; font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 900; }
.tag.ap { background: rgba(217,70,239,.4); }
.tag.fc { background: rgba(251,191,36,.4); color: #000; }
.tag.lg { font-size: 13px; padding: 3px 12px; }
.none { color: rgba(255,255,255,.3); font-size: 13px; }

.carousel { position: relative; flex: 1; max-width: 620px; height: 100%; display: flex; align-items: center; justify-content: center; }
.nav-btn {
  position: absolute; z-index: 20; width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,.1); color: #fff; font-size: 24px; transition: background .15s;
}
.nav-btn:hover { background: rgba(255,255,255,.25); }
#prev { left: 0; } #next { right: 0; }
.carousel-inner { position: relative; width: 100%; height: 75%; display: flex; align-items: center; justify-content: center; }
.jacket-card {
  position: absolute; width: min(38vh, 30vw); aspect-ratio: 1; border-radius: 18px; overflow: hidden;
  border: 4px solid rgba(255,255,255,.3); cursor: pointer;
  transform: translateX(calc(var(--off) * 36%)) scale(.62) rotateY(calc(var(--off) * -28deg));
  filter: brightness(.55); transition: all .3s cubic-bezier(.34,1.4,.5,1);
}
.jacket-card img { width: 100%; height: 100%; object-fit: cover; }
.jacket-card.focus {
  transform: none; scale: 1; border-color: #fff;
  box-shadow: 0 0 50px rgba(255,255,255,.35); filter: none; cursor: default;
}
.jacket-caption {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 14px 12px;
  background: linear-gradient(transparent, rgba(0,0,0,.85)); text-align: left;
}
.j-title { font-weight: 900; font-size: 17px; line-height: 1.25; }
.j-sub { color: rgba(255,255,255,.7); font-size: 11px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lv-badge {
  position: absolute; top: -12px; right: -12px; width: 56px; height: 56px; border-radius: 50%;
  border: 4px solid #fff; display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 900; box-shadow: 0 4px 14px rgba(0,0,0,.4);
}

.side-panel { width: 224px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
.help-box { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 16px; }
.help-title { font-size: 11px; letter-spacing: .15em; color: rgba(255,255,255,.4); margin-bottom: 8px; }
.help-row { display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(255,255,255,.7); padding: 3px 0; }

.select-bottom { position: absolute; bottom: 14px; left: 0; right: 0; z-index: 5; text-align: center; }
.type-toggle { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
.type-btn {
  padding: 6px 24px; border-radius: 999px; font-size: 14px; font-weight: 900; letter-spacing: .12em;
  background: rgba(255,255,255,.04); border: 2px solid; opacity: .5; transition: all .15s;
}
.type-btn span { font-size: 10px; opacity: .8; margin-left: 8px; letter-spacing: 0; }
.type-btn[data-t="STD"] { color: #3ddc84; border-color: #3ddc84; }
.type-btn[data-t="DX"] { color: #ffd34d; border-color: #ffd34d; }
.type-btn.on { opacity: 1; transform: scale(1.05); }
.type-btn[data-t="STD"].on { background: rgba(61,220,132,.18); box-shadow: 0 0 18px rgba(61,220,132,.33); }
.type-btn[data-t="DX"].on { background: rgba(255,211,77,.18); box-shadow: 0 0 18px rgba(255,211,77,.33); }
.diff-bar { display: flex; justify-content: center; align-items: center; gap: 10px; }
.diff-btn {
  min-width: 92px; padding: 10px 16px; border-radius: 12px; background: rgba(255,255,255,.08);
  color: rgba(255,255,255,.75); opacity: .6; transition: all .15s;
}
.diff-btn:hover { opacity: .9; }
.diff-btn.on { opacity: 1; transform: scale(1.1); box-shadow: 0 0 25px rgba(255,255,255,.3); }
.d-label { font-size: 11px; letter-spacing: .05em; font-weight: 800; }
.d-lv { font-size: 22px; font-weight: 900; line-height: 1.1; }
.mobile-go { display: none; padding: 10px 24px; font-size: 17px; }
.select-hint { margin-top: 8px; font-size: 12px; color: rgba(255,255,255,.35); letter-spacing: .1em; }

/* ---------- 游戏画面 ---------- */
.game-screen { background: #060a1c; }
#game-canvas { display: block; width: 100%; height: 100%; }
.key-hint {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px; transition: opacity .7s; pointer-events: none; z-index: 5;
}
.kh { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.kh-key {
  width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 900;
}
.kh-key.sp { font-size: 10px; width: 44px; }
.kh-pos { font-size: 10px; color: rgba(255,255,255,.5); }
.pause-btn {
  position: absolute; top: 12px; right: 12px; z-index: 20; width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,.1); color: #fff; font-size: 16px;
}
.pause-btn:hover { background: rgba(255,255,255,.25); }
.pause-overlay {
  position: absolute; inset: 0; z-index: 30; background: rgba(6,10,28,.85);
  backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center;
}
.pause-box { text-align: center; display: flex; flex-direction: column; gap: 14px; min-width: 260px; }
.pause-title { font-size: 38px; font-weight: 900; letter-spacing: .2em; color: #a5f3fc; }
.pause-sub { font-size: 13px; color: rgba(255,255,255,.6); margin-top: -6px; }
.pause-esc { font-size: 12px; color: rgba(255,255,255,.35); }

/* ---------- 结算画面 ---------- */
.results-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 20px; }
.results-panel {
  position: relative; z-index: 2; display: flex; align-items: center; gap: 44px;
  background: rgba(10,16,42,.75); border: 1px solid rgba(255,255,255,.12); border-radius: 28px;
  padding: 36px 44px; backdrop-filter: blur(8px); max-width: 94vw;
  animation: resIn .5s cubic-bezier(.2,1.3,.4,1) both;
}
@keyframes resIn { from { transform: translateY(40px) scale(.94); opacity: 0 } to { transform: none; opacity: 1 } }
.results-jacket { width: min(26vh, 220px); border-radius: 18px; overflow: hidden; border: 4px solid #fff; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.results-jacket img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.results-song { text-align: center; max-width: 280px; }
.results-title { font-size: 24px; font-weight: 900; margin-top: 12px; word-break: break-all; }
.results-artist { color: rgba(255,255,255,.6); font-size: 13px; margin: 4px 0 10px; }
.results-badges { display: flex; justify-content: center; gap: 8px; align-items: center; flex-wrap: wrap; }
.type-chip { padding: 4px 12px; border-radius: 8px; font-size: 12px; font-weight: 900; border: 2px solid; }
.type-chip.dx { color: #ffd34d; border-color: #ffd34d; background: rgba(255,211,77,.15); }
.type-chip.std { color: #3ddc84; border-color: #3ddc84; background: rgba(61,220,132,.15); }
.autoplay-note { margin-top: 10px; font-size: 12px; font-weight: 900; color: #fcd34d; animation: mmBlink 1s infinite; }
.results-ach { text-align: center; min-width: 300px; }
.ach-label { font-size: 13px; letter-spacing: .35em; color: rgba(255,255,255,.6); font-weight: 700; }
.ach-num { font-size: 68px; font-weight: 900; color: #fff; text-shadow: 0 0 30px rgba(62,230,255,.5); font-variant-numeric: tabular-nums; }
.ach-num span { font-size: 34px; }
.ach-num.rainbow {
  background: linear-gradient(135deg,#ff5f6d,#ffc371,#7ee8a2,#4facfe,#b06ab3);
  -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none;
}
.rank-badge { margin-top: 10px; height: 110px; display: flex; align-items: center; justify-content: center; }
.rank-badge span { font-size: 92px; font-weight: 900; font-style: italic; line-height: 1; animation: rankIn .55s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes rankIn { from { transform: scale(2.4) rotate(-6deg); opacity: 0 } to { transform: none; opacity: 1 } }
.fc-badge { min-height: 28px; }
.rating-row { font-size: 14px; color: rgba(255,255,255,.75); font-weight: 700; }
.rating-row b { color: #ffd76a; }
.results-detail { min-width: 280px; }
.detail-title { font-size: 12px; letter-spacing: .15em; color: rgba(255,255,255,.4); margin-bottom: 10px; font-weight: 800; }
.detail-row { display: flex; justify-content: space-between; font-size: 14px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
.results-btns { position: relative; z-index: 2; display: flex; gap: 16px; }

/* ---------- 弹窗 ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.8); backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.modal {
  width: min(640px, 94vw); max-height: 88vh; overflow-y: auto; border-radius: 24px;
  background: #0d1533; border: 1px solid rgba(255,255,255,.15); padding: 26px 30px;
  animation: resIn .3s ease-out both;
}
.modal-head { display: flex; justify-content: space-between; align-items: center; font-size: 22px; font-weight: 900; color: #a5f3fc; margin-bottom: 18px; }
.modal-close { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.1); color: #fff; font-size: 15px; }
.modal-close:hover { background: rgba(255,255,255,.25); }
.setting-row { margin-bottom: 18px; }
.setting-row label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 800; margin-bottom: 6px; }
.setting-row label b { color: #7fd0ff; }
input[type="range"] { width: 100%; accent-color: #22d3ee; height: 22px; }
.range-marks { display: flex; justify-content: space-between; font-size: 11px; color: rgba(255,255,255,.4); margin-top: 2px; }
.setting-tip { font-size: 12px; color: rgba(255,255,255,.45); margin-top: 8px; line-height: 1.6; }
.toggle-row {
  width: 100%; text-align: left; padding: 13px 16px; border-radius: 12px; font-size: 14px; font-weight: 800;
  background: rgba(255,255,255,.06); color: rgba(255,255,255,.75); margin-bottom: 6px;
}
.toggle-row.on { background: rgba(34,211,238,.15); color: #a5f3fc; box-shadow: inset 0 0 0 1px rgba(34,211,238,.4); }
.modal .btn.cyan { width: 100%; margin-top: 12px; }
.modal.howto h4 { font-size: 17px; font-weight: 900; margin: 20px 0 10px; color: rgba(255,255,255,.9); }
.howto-keys { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.note-row { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
.note-row i { font-style: normal; color: rgba(255,255,255,.4); font-size: 12px; min-width: 34px; }
.note-row span:last-child { color: rgba(255,255,255,.6); }
.note-dot {
  width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 900; color: #081226; flex-shrink: 0;
}
.judge-row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
.judge-row b { font-size: 14px; }
.judge-row span { color: rgba(255,255,255,.55); }
.howto-text p { font-size: 13px; color: rgba(255,255,255,.7); line-height: 1.8; }

/* ---------- 响应式 ---------- */
@media (max-width: 1100px) {
  .song-info, .side-panel { display: none; }
  .mobile-go { display: inline-block; }
  .select-main { gap: 0; padding: 0 12px; }
  .results-panel { flex-direction: column; gap: 20px; padding: 26px; text-align: center; }
  .results-detail { min-width: 240px; width: 100%; }
  .jacket-card { width: min(34vh, 46vw); }
  .diff-btn { min-width: 68px; padding: 8px 10px; }
  .d-lv { font-size: 18px; }
  .info-table, .best-title { font-size: 12px; }
}

</style>
</head>
